<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="auth-view" class="view">
  <div class="card">
    <h1>Chat</h1>
    <input id="auth-username" placeholder="Username">
    <input id="auth-password" type="password" placeholder="Password">
    <div class="row">
      <button id="btn-login">Log in</button>
      <button id="btn-signup" class="secondary">Sign up</button>
    </div>
    <p id="auth-error" class="error"></p>
  </div>
</div>

<div id="app-view" class="view hidden">
  <div class="sidebar">
    <div class="sidebar-header">
      <img id="me-avatar" class="my-avatar" alt="">
      <span id="me"></span>
      <div>
        <button id="btn-open-settings" class="link" title="Settings">⚙️</button>
        <button id="btn-logout" class="link">Log out</button>
      </div>
    </div>

    <h3>My channels</h3>
    <ul id="my-channels" class="channel-list"></ul>

    <h3>Public channels</h3>
    <ul id="public-channels" class="channel-list"></ul>

    <div class="sidebar-actions">
      <input id="new-channel-name" placeholder="New channel name">
      <label><input type="checkbox" id="new-channel-private"> Private</label>
      <button id="btn-create-channel">Create</button>
    </div>
    <div class="sidebar-actions">
      <input id="invite-code" placeholder="Invite code">
      <button id="btn-join-code">Join</button>
    </div>

    <div id="voice-panel" class="voice-panel hidden">
      <div class="voice-panel-title">
        Voice connected
        <button id="btn-expand-voice" class="link" title="Open voice window">⤢</button>
      </div>
      <div id="voice-participants"></div>
      <div class="voice-controls">
        <button id="btn-mute" class="vc-btn" title="Mute">🎤</button>
        <button id="btn-deafen" class="vc-btn" title="Deafen">🎧</button>
        <button id="btn-leave-voice" class="vc-btn vc-leave" title="Leave">📞</button>
      </div>
    </div>
  </div>

  <div class="main">
    <div id="channel-header">
      <span id="channel-title">Select a channel</span>
      <div>
        <button id="btn-mute-channel" class="header-btn hidden" title="Mute notifications for this channel">🔔</button>
        <button id="btn-join-voice" class="hidden">🎙 Join Voice</button>
      </div>
    </div>
    <div id="video-grid" class="hidden"></div>
    <div id="messages"></div>
    <div id="composer" class="hidden">
      <button id="btn-attach" title="Attach a file">📎</button>
      <input id="file-input" type="file" class="hidden">
      <button id="btn-emoji" title="Emoji">😀</button>
      <div id="emoji-popover" class="hidden"></div>
      <input id="message-input" placeholder="Type a message...">
      <button id="btn-send">Send</button>
      <button id="btn-cancel-edit" class="hidden secondary">Cancel</button>
    </div>
    <div id="upload-progress" class="hidden"></div>
  </div>
</div>

<!-- Settings overlay: notifications + background customization -->
<div id="settings-overlay" class="overlay hidden">
  <div class="overlay-card">
    <div class="overlay-header">
      <h3>Settings</h3>
      <button id="btn-close-settings" class="link">✕</button>
    </div>

    <h4>Profile picture</h4>
    <div class="avatar-settings-row">
      <img id="avatar-preview" class="my-avatar large" alt="">
      <div>
        <label class="upload-label">Upload photo/GIF
          <input id="avatar-file-input" type="file" accept="image/*" class="hidden">
        </label>
        <button id="btn-open-giphy" class="secondary">Choose a GIF (GIPHY)</button>
      </div>
    </div>
    <div id="giphy-popover" class="hidden">
      <input id="giphy-search" placeholder="Search GIPHY...">
      <div id="giphy-results" class="giphy-grid"></div>
    </div>

    <h4>Notifications</h4>
    <label class="settings-row"><input type="checkbox" id="notif-global-toggle"> Enable message notifications</label>
    <button id="btn-enable-browser-notif" class="secondary">Enable browser notifications</button>
    <p id="notif-status" class="hint"></p>

    <h4>Chat background</h4>
    <div class="bg-presets">
      <button class="bg-preset" data-bg="dark" style="background:#313338"></button>
      <button class="bg-preset" data-bg="black" style="background:#000"></button>
      <button class="bg-preset" data-bg="white" style="background:#fff"></button>
      <button class="bg-preset" data-bg="navy" style="background:#1a1b3a"></button>
    </div>
    <input id="bg-url-input" placeholder="Image or GIF URL">
    <button id="btn-apply-bg-url" class="secondary">Apply URL</button>
    <label class="upload-label">Or upload your own image/GIF
      <input id="bg-file-input" type="file" accept="image/*" class="hidden">
    </label>
  </div>
</div>

<!-- Pop-out voice window, Discord-style -->
<div id="voice-float" class="voice-float hidden">
  <div id="voice-float-header" class="voice-float-header">
    <span>🎙 Voice</span>
    <button id="btn-minimize-voice" class="link">–</button>
  </div>
  <div id="voice-float-video-grid" class="voice-float-video-grid"></div>
  <div id="voice-float-participants" class="voice-float-participants"></div>
  <div class="voice-float-controls">
    <button id="float-btn-mute" class="vc-btn" title="Mute">🎤</button>
    <button id="float-btn-deafen" class="vc-btn" title="Deafen">🎧</button>
    <button id="float-btn-camera" class="vc-btn" title="Camera">📷</button>
    <button id="float-btn-screenshare" class="vc-btn" title="Share screen">🖥️</button>
    <button id="float-btn-settings" class="vc-btn" title="Voice settings">⚙️</button>
    <button id="float-btn-leave" class="vc-btn vc-leave" title="Leave">📞</button>
  </div>
  <div id="voice-settings" class="voice-settings hidden">
    <label>Microphone
      <select id="select-mic"></select>
    </label>
    <label>Speaker
      <select id="select-speaker"></select>
    </label>
    <label>Camera
      <select id="select-camera"></select>
    </label>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1/index.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="voice.js"></script>
</body>
</html>
